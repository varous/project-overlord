name: CI

on:
  push:
    branches-ignore:
      - snapshots
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      has_cloudflare_token: ${{ steps.detect.outputs.has_cloudflare_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Detect Cloudflare secret
        id: detect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_cloudflare_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cloudflare_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        run: make verify
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BRANCH: ${{ github.head_ref || github.ref_name }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || '' }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres

      - name: API integration test count
        run: |
          npx vitest run apps/api --reporter=json --outputFile=api-tests.json
          node -e "const r=require('./api-tests.json'); const total=r.numTotalTests||0; const passed=r.numPassedTests||0; console.log('API tests ran in CI: '+passed+'/'+total+' passed'); if (total===0) process.exit(1);"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/postgres

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload offline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-screenshots
          path: e2e-output
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.has_cloudflare_token == 'true'
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Check the downloaded artifact
        run: node scripts/check-web-build.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Preflight Cloudflare token
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare API token cannot list Pages projects (HTTP ${STATUS}). The token needs 'Account -> Cloudflare Pages -> Edit' on the account matching CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Ensure Pages project
        run: npx --yes wrangler@4 pages project create project-overlord --production-branch main || true

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name project-overlord \
            --branch "${BRANCH_NAME}" \
            --commit-hash "${GITHUB_SHA}" 2>&1 | tee deploy.log
          UNIQUE_URL="$(grep -oE 'https://[a-z0-9]+\.project-overlord[0-9a-z-]*\.pages\.dev' deploy.log | head -n 1 || true)"
          ALIAS_URL="$(grep -oE 'https://[a-z0-9-]+\.project-overlord[0-9a-z-]*\.pages\.dev' deploy.log | tail -n 1 || true)"
          echo "deployment_url=${UNIQUE_URL}" >> "$GITHUB_OUTPUT"
          echo "alias_url=${ALIAS_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify the deployment
        id: verify_deploy
        env:
          UNIQUE_URL: ${{ steps.deploy.outputs.deployment_url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
        run: |
          set -e
          if [ -z "$UNIQUE_URL" ] || [ -z "$ALIAS_URL" ]; then
            echo "::error::Could not parse the deployment URLs from wrangler's output."
            exit 1
          fi
          node scripts/check-deployment.mjs "$UNIQUE_URL"
          node scripts/check-deployment.mjs "$ALIAS_URL"
          echo "verified=${UNIQUE_URL},${ALIAS_URL}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          UNIQUE_URL="${{ steps.deploy.outputs.deployment_url }}"
          ALIAS_URL="${{ steps.deploy.outputs.alias_url }}"
          DEPLOY_VERIFIED="${{ steps.verify_deploy.outputs.verified }}"
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Branch: \`${BRANCH_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Unique deployment URL: ${UNIQUE_URL:-not found}"
            echo "- Branch alias URL: ${ALIAS_URL:-not found}"
            echo "- Deployment verified: ${DEPLOY_VERIFIED:-not verified}"
          } >> "$GITHUB_STEP_SUMMARY"

  snapshots:
    name: Publish screenshots
    needs: [verify, deploy]
    if: always() && github.event_name == 'push' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build web with Google key
        run: npm run build -w @overlord/web
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BRANCH: ${{ github.ref_name }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || '' }}

      - name: Offline and persistence smoke
        run: npm run smoke

      - name: Online smoke
        id: online
        continue-on-error: true
        run: npm run smoke:online

      - name: Publish to snapshots branch
        env:
          ONLINE_OUTCOME: ${{ steps.online.outcome }}
        run: bash scripts/publish-snapshots.sh

  api-image:
    name: api-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/Dockerfile .

      - name: Image size
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -n 5
