name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      has_cloudflare_token: ${{ steps.detect.outputs.has_cloudflare_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Detect Cloudflare secret
        id: detect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "has_cloudflare_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cloudflare_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        run: make verify
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.has_cloudflare_token == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ensure Pages project
        run: npx --yes wrangler@4 pages project create project-overlord --production-branch main || true

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name project-overlord \
            --branch "${BRANCH_NAME}" \
            --commit-hash "${GITHUB_SHA}" 2>&1 | tee deploy.log

      - name: Job summary
        if: always()
        run: |
          UNIQUE_URL="$(grep -oE 'https://[a-z0-9-]+\.project-overlord\.pages\.dev' deploy.log 2>/dev/null | tail -n 1 || true)"
          BRANCH_ALIAS="https://${BRANCH_NAME//\//-}.project-overlord.pages.dev"
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Branch: \`${BRANCH_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Unique deployment URL: ${UNIQUE_URL:-not found}"
            echo "- Branch alias URL: ${BRANCH_ALIAS}"
          } >> "$GITHUB_STEP_SUMMARY"
