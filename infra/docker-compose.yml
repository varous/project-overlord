# Local development Postgres for the API's integration tests.
# Uses port 5433 on the host to avoid clashing with any local Postgres on 5432.
#
#   docker compose -f infra/docker-compose.yml up -d
#   export TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/postgres
#   npm test
services:
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
