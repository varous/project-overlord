# Render Blueprint for project-overlord's scene API.
#
# Costs (approximate, USD/month, subject to Render pricing):
#   - Web service: Starter plan ~ $7/month.
#   - Postgres:    basic-256mb plan ~ $7/month.
# The web service and the database MUST be in the same region (singapore / sin1).
#
# Apply with:  render blueprint apply  (from the repo root, once Render is linked).

services:
  - type: web
    name: project-overlord-api
    runtime: docker
    dockerfilePath: infra/Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /health
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: project-overlord-db
          property: connectionString
      - key: OVERLORD_API_TOKEN
        sync: false
        # Set in the Render dashboard; never in the repo. Rotate by generating a new value here.
      - key: CORS_ORIGINS
        value: https://project-overlord-7xs.pages.dev,https://*.project-overlord-7xs.pages.dev
      - key: PUBLIC_WEB_URL
        value: https://project-overlord-7xs.pages.dev
      # COMMIT_SHA is served at runtime from Render's RENDER_GIT_COMMIT (see apps/api/src/config.ts).

  # The ShowPlan editor service (apps/api-sp serves its own apps/web-sp build on
  # one origin — session cookies need same-origin). Shares project-overlord-db,
  # isolated in its own Postgres schema. See docs/runbooks/editor-deploy.md.
  - type: web
    name: overlord-editor
    runtime: docker
    dockerfilePath: apps/api-sp/infra/Dockerfile
    dockerContext: "."
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DB_SCHEMA
        value: showplan
      - key: DATABASE_URL
        fromDatabase:
          name: project-overlord-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://overlord-editor.onrender.com
      - key: ALLOWED_HD
        value: clockwork-av.com
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: project-overlord-db
    plan: basic-256mb
    region: singapore

# Render requires this file at the repository root.
# The Dockerfile and compose file stay in infra/.
